<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pustak</title>
<style>
:root{--bg:#0b0b0c;--p:#121214;--p2:#1a1a1d;--b:#2a2a2e;--t:#e6e6e9;--m:#8d8d96;--ac:#f1f1f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:radial-gradient(1100px 520px at 15% -10%,#1d1d22,transparent),var(--bg);color:var(--t);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{height:100%}
button,input,textarea,select{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:7px 12px;transition:.15s}
input[type=checkbox]{width:auto;padding:0}
button{cursor:pointer}button:hover{background:#2b2b30;border-color:#4a4a52}button:active{transform:scale(.97)}
.row button.on{background:var(--ac);color:#0b0b0c;border-color:var(--ac)}.row button.on:hover{background:#fff}
.pri,.ov button:first-of-type{background:var(--ac);color:#0b0b0c;border-color:var(--ac);font-weight:600}.pri:hover,.ov button:first-of-type:hover{background:#fff}
input:focus,textarea:focus,select:focus{outline:0;border-color:#6a6a74;box-shadow:0 0 0 3px #ffffff12}.m{color:var(--m)}
.home{max-width:780px;margin:0 auto;padding:60px 22px}
.home h1{font:700 54px/1.05 Georgia,serif;margin:0;letter-spacing:.5px}.home h1 small{display:block;font:500 12px system-ui;letter-spacing:7px;text-transform:uppercase;color:var(--m);margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:28px 0}
.card{position:relative;background:linear-gradient(160deg,#1d1d21,#111113);border:1px solid var(--b);border-radius:16px;overflow:hidden;transition:.2s}
.card:hover{border-color:#5a5a64;transform:translateY(-3px);box-shadow:0 14px 34px #000a}
.card .op{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:22px 18px;background:none;border:0;border-radius:0;font-size:16px}.card .op:hover{background:none}.card .op span{font-size:12px;color:var(--m)}.card .op i{font-style:normal;font-size:28px}
.card .tr{position:absolute;top:8px;right:8px;padding:3px 7px;font-size:12px;background:#0007;opacity:.5}.card .tr:hover{opacity:1;background:#4a1c1c;border-color:#8a3030}
.card.add{display:flex;align-items:center;justify-content:center;min-height:118px;border:1px dashed #44444c;color:var(--m);font-size:15px;background:none}.card.add:hover{color:#fff;border-color:#888}
#app{display:flex;height:100%}
#side{width:272px;background:linear-gradient(180deg,#141416,#0e0e10);border-right:1px solid var(--b);display:flex;flex-direction:column;padding:16px 14px;gap:10px;overflow:hidden}
.brand{font:700 24px Georgia,serif;letter-spacing:.5px}.brand small{font:500 10px system-ui;letter-spacing:3px;text-transform:uppercase;color:var(--m);margin-left:6px}
#tree{overflow:auto;flex:1;margin:0 -4px;padding:0 4px}
.fd{color:var(--m);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin:14px 0 4px}
.nt{padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c4c4cc}.nt:hover{background:var(--p2)}.nt.on{background:#26262b;color:#fff;box-shadow:inset 3px 0 #fff}
.ghost{background:none;border-color:transparent;color:var(--m);text-align:left}.ghost:hover{color:#f0a0a0;background:#2a1a1a;border-color:transparent}
#main{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px 22px;gap:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row input:not([type=color]):not([type=checkbox]){flex:1;min-width:100px}
#tb button,.db .row button{padding:4px 10px;font-size:13px}
#ti{font:600 26px Georgia,serif;background:none;border:0;border-bottom:1px solid var(--b);border-radius:0;padding:6px 2px}
.wrap{flex:1;overflow:auto}
#blk{display:flex;flex-direction:column;gap:12px;max-width:920px;width:100%;margin:0 auto;padding:6px 2px 70px}
.tx{width:100%;resize:none;overflow:hidden;background:transparent;border:1px solid transparent;line-height:1.75;font-size:15.5px;min-height:56px;padding:8px 10px}.tx:focus{border-color:var(--b);background:var(--p);box-shadow:none}
.db,.im{position:relative;border:1px solid var(--b);border-radius:14px;background:var(--p);padding:8px;display:flex;flex-direction:column;gap:8px}
.im img{max-width:100%;border-radius:10px;align-self:center}
.pv{background:transparent;padding:4px 10px}.pv ul,.pv ol{margin:4px 0;padding-left:22px}.pv .tk{list-style:none;margin-left:-20px}
.pv .cm{border-left:3px solid #777;background:#1a1a1d;padding:5px 12px;margin:6px 0;color:#b8b8bf;border-radius:0 8px 8px 0}
.pv a,.bl a{color:#fff;text-decoration:underline dotted;cursor:pointer}.pv code{background:#26262a;padding:1px 6px;border-radius:5px}
.bl{font-size:12px;color:var(--m);text-align:center}
canvas{width:100%;background:radial-gradient(#2a2a2f 1px,transparent 1px) 0 0/22px 22px,#0e0e10;border:1px solid var(--b);border-radius:10px;touch-action:none;min-height:0}
.ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:50}
.ov>div{background:var(--p);border:1px solid var(--b);padding:24px;border-radius:16px;display:flex;flex-direction:column;gap:12px;min-width:300px;box-shadow:0 24px 70px #000}
@media(max-width:700px){#app{flex-direction:column}#side{width:auto;max-height:36vh}#main{padding:10px}.home h1{font-size:40px}}
body{background:radial-gradient(900px 500px at 10% -10%,#23232a,transparent),radial-gradient(800px 500px at 100% 110%,#1c1c22,transparent),var(--bg)}
button:hover{background:linear-gradient(135deg,#34343a,#26262b)}
.pri,.ov button:first-of-type{background:linear-gradient(135deg,#fff,#aeaebb)}
.row button.on{background:linear-gradient(135deg,#fafafa,#a6a6b4)}
.brand,.home h1{background:linear-gradient(90deg,#fff,#7d7d8a);-webkit-background-clip:text;background-clip:text;color:transparent}
.nt.on{background:linear-gradient(90deg,#34343b,#1e1e23)}
#tb{padding:6px 10px;border:1px solid var(--b);border-radius:12px;background:linear-gradient(90deg,#1a1a1e,#121214)}
.grp{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--m)}.sep{width:1px;height:20px;background:var(--b);margin:0 6px}
.db,.im{background:linear-gradient(160deg,#161619,#0f0f11)}
.fd span{background:#26262c;border-radius:10px;padding:0 7px;margin-left:4px;font-size:10px;letter-spacing:0}
#side{transition:width .25s ease,padding .25s ease,opacity .2s ease}
#sb{font-size:16px;padding:5px 12px}
#app.hide #side{width:0;padding-left:0;padding-right:0;opacity:0;border-right-width:0;pointer-events:none}
@media(max-width:700px){#app.hide #side{width:auto;max-height:0;padding:0;border:0}}
#tags{display:flex;gap:4px;flex-wrap:wrap}#tags:empty{display:none}
.tg{padding:2px 9px;font-size:11px;border-radius:20px}.tg.on{background:var(--ac);color:#0b0b0c;border-color:var(--ac)}
.tag{color:#9fb0ff}
.fd{display:flex;align-items:center;gap:4px}.fd .fl{flex:1;cursor:pointer;background:none;padding:0;margin:0;font-size:inherit;letter-spacing:inherit}
.fd .fa{display:none;background:none;padding:0;margin:0}.fd:hover .fa{display:inline-flex}.fa button{padding:0 6px;font-size:11px;background:none;border:0;letter-spacing:0}
.nt.tz{display:flex;gap:4px;align-items:center;color:var(--m)}.nt.tz span{flex:1;overflow:hidden;text-overflow:ellipsis}.nt.tz button{padding:0 6px;font-size:11px;background:none;border:0}
.menu{display:flex;flex-direction:column;gap:8px}
.ov .menu button,.ov .menu button:first-of-type{background:var(--p2);color:var(--t);border:1px solid var(--b);font-weight:400;text-align:left}.ov .menu button:hover{background:#2b2b30}
.pt{display:none}
@media print{#side,#sb,#tb,.db .row,.im .row,.im>div,.bl,#body>.row,#main>.row,.ov{display:none!important}html,body,#app,#main,#body,.wrap{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}.pt{display:block;color:#000}.pv,.pv *{color:#000!important;background:none!important}canvas{filter:invert(1) hue-rotate(180deg)}}
.acb{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--p);border:1px solid #55555e;border-radius:12px;padding:6px;min-width:260px;box-shadow:0 14px 40px #000c;z-index:40}
.ov .menu{max-height:86vh;overflow:auto}.menu label{display:flex;gap:8px;align-items:center}
</style></head><body><div id="root"></div>
<script>
const $=s=>document.querySelector(s),TE=new TextEncoder(),TD=new TextDecoder();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const db=()=>{try{return JSON.parse(localStorage.pustak||'{}')}catch(e){return{}}};
const put=o=>{try{localStorage.pustak=JSON.stringify(o)}catch(e){alert('Storage unavailable or full')}};
async function derive(pw,salt){const k=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(key,o){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(JSON.stringify(o))));
 const r=new Uint8Array(12+ct.length);r.set(iv);r.set(ct,12);return b64(r)}
async function dec(key,s){const u=ub(s);return JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12))))}
let S=null,cur=null,view='w',read=false,sv,lt,hist=[],q='',tool='sel',pc='#e0e0e0';
const uid=()=>Math.random().toString(36).slice(2,9);
const mk=(title,folder,body)=>({id:uid(),title,folder:folder||'',cre:Date.now(),upd:Date.now(),blocks:[{t:'x',v:body||''}]});
const live=()=>S.data.notes.filter(n=>!n.del);
function save(){if(cur&&!cur.del){cur.upd=Date.now();snap(cur)}clearTimeout(sv);sv=setTimeout(flush,500)}
async function flush(){if(!S)return;const d=db();d[S.name].blob=await enc(S.key,S.data);put(d)}
function ask(msg,pw){return new Promise(r=>{const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div><b>${esc(msg)}</b><input ${pw?'type=password':''} id=ai autocomplete=off autofocus><span class=row><button id=ok>OK</button><button id=no>Cancel</button></span></div>`;document.body.append(o);
 const i=o.querySelector('input');i.focus();const f=v=>{o.remove();r(v)};o.querySelector('#ok').onclick=()=>f(i.value);o.querySelector('#no').onclick=()=>f(null);i.onkeydown=e=>{if(e.key=='Enter')f(i.value);if(e.key=='Escape')f(null)}})}
function newT(d){return new Promise(r=>{const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div><b>New tijori</b><input id=tn placeholder="Tijori name (subject)" autocomplete=off><input id=tp type=password placeholder="Password you want for this tijori" autocomplete=new-password><span id=sm style=font-size:12px></span><input id=tq type=password placeholder="Confirm password" autocomplete=new-password><label class=m><input type=checkbox id=ts style="padding:0"> Show password</label><span id=te style="color:#e08080"></span><span class=row><button id=tc>Create</button><button id=tx>Cancel</button></span></div>`;
 document.body.append(o);const g=i=>o.querySelector(i);g('#tn').focus();
 g('#ts').onchange=e=>{g('#tp').type=g('#tq').type=e.target.checked?'text':'password'};
 g('#tp').oninput=()=>{const v=g('#tp').value,sc=(v.length>=8)+(v.length>=12)+(/[a-z]/.test(v)&&/[A-Z]/.test(v))+/\d/.test(v)+/[^A-Za-z0-9]/.test(v),m=g('#sm');m.textContent=v?(sc<=1?'Weak':sc<=3?'Okay':'Strong')+' password':'';m.style.color=sc<=1?'#e08080':sc<=3?'#e0c070':'#80d0a0'};g('#tx').onclick=()=>{o.remove();r(null)};
 g('#tc').onclick=()=>{const n=g('#tn').value.trim(),pw=g('#tp').value,e=m=>g('#te').textContent=m;
  if(!n)return e('Enter a name');if(d[n])return e('That name already exists');if(pw.length<4)return e('Password needs 4+ characters');if(pw!==g('#tq').value)return e('Passwords do not match');o.remove();r({n,pw})}})}
async function delT(n){const t=await ask('Type the tijori name “'+n+'” to delete it forever');if(t==null)return;if(t.trim()!==n)return alert('Name did not match, nothing was deleted');const d=db();delete d[n];put(d);if(S&&S.name==n){S=null;clearTimeout(lt)}home()}
function yes(m){return new Promise(r=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div><b>${esc(m)}</b><span class=row><button id=y>Yes</button><button id=n>Cancel</button></span></div>`;document.body.append(o);o.querySelector('#y').onclick=()=>{o.remove();r(1)};o.querySelector('#n').onclick=()=>{o.remove();r(0)}})}
window.alert=m=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div><b>${esc(m)}</b><button>OK</button></div>`;document.body.append(o);o.querySelector('button').onclick=()=>o.remove()};
function home(){S=null;cur=null;clearTimeout(lt);const d=db();
 $('#root').innerHTML=`<div class=home><h1>पुस्तक <small>Pustak</small></h1><p class=m>Each tijori is a locked notebook with its own password.</p>
 <div class=cards>${Object.keys(d).map(n=>`<div class=card><button class=op data-n="${esc(n)}"><i>🔒</i><b>${esc(n)}</b><span>Locked · tap to open</span></button><button class=tr data-d="${esc(n)}" title="Delete tijori">🗑</button></div>`).join('')}<button id=mkb class="card add">＋ New tijori</button><button id=imp class="card add">📥 Import backup</button><input type=file id=impf accept=".json,application/json" hidden></div>
 
 <p class=m>AES-256-GCM encryption, key from your password (PBKDF2). No password recovery.</p></div>`;
 $('#imp').onclick=()=>$('#impf').click();$('#impf').onchange=impBackup;document.querySelectorAll('.tr').forEach(b=>b.onclick=()=>delT(b.dataset.d));document.querySelectorAll('.op').forEach(b=>b.onclick=async()=>{const n=b.dataset.n,pw=await ask('Password for “'+n+'”',1);if(pw==null)return;
  try{const key=await derive(pw,ub(d[n].salt)),data=await dec(key,d[n].blob);FAIL[n]=0;S={name:n,key,data};S.data.notes.forEach(norm);cur=S.data.notes[0];view='w';read=false;app();touch()}
  catch(e){FAIL[n]=(FAIL[n]||0)+1;const w=Math.min(30,2**(FAIL[n]-1));await new Promise(r=>setTimeout(r,w*1000));alert('Wrong password (attempt '+FAIL[n]+'). '+(FAIL[n]>1?'Retries are slowed down to protect your data.':''))}});
 $('#mkb').onclick=async()=>{const r=await newT(d);if(!r)return;const{n,pw}=r;const salt=crypto.getRandomValues(new Uint8Array(16)),key=await derive(pw,salt);
  const data={notes:[mk('Welcome','Start','# Welcome to Pustak\n- Link notes like [[Ideas]]\n1. Numbered lists continue on Enter\n- [ ] Tasks too\n> 💬 Comments look like this\nPress ▦ Draw block to sketch inside a note.'),mk('Ideas','Start','Back to [[Welcome]]')]};
  d[n]={salt:b64(salt),blob:await enc(key,data)};put(d);home()}}
function lock(){flush().then(home)}
const FAIL={};
function cfg(){return S.data.cfg=S.data.cfg||{lock:5,blur:false}}
function touch(){clearTimeout(lt);const m=S?cfg().lock:5;if(m>0)lt=setTimeout(()=>{if(S)lock()},m*60000)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&cfg().blur)lock()});
addEventListener('error',e=>{try{alert('Error: '+e.message)}catch(_){}});
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>S&&touch()));
const links=t=>[...t.matchAll(/\[\[([^\]]+)\]\]/g)].map(m=>m[1].trim());
const byTitle=t=>live().find(n=>n.title.toLowerCase()==t.toLowerCase());
function open(t){let n=byTitle(t);if(!n){n=mk(t);S.data.notes.push(n);save()}cur=n;view='w';read=false;side();main()}
function app(){$('#root').innerHTML=`<div id=app><div id=side><div class=brand>पुस्तक<small>Pustak</small></div><div class=row><b style="flex:1">🔓 ${esc(S.name)}</b><button id=lk>🔒 Lock</button></div>
 <input id=sq placeholder="Search…  (Ctrl+K to jump)"><div class=row><button id=nw class=pri style="flex:1">＋ Note</button><button id=nf style="flex:1">📁 Folder</button></div><div class=row><button id=td style="flex:1">📅 Today</button><button id=mo style="flex:1">⚙ More</button></div><div id=tags></div><div id=tree></div><button id=dt class=ghost>🗑 Delete this tijori</button></div><div id=main></div></div>`;
 $('#lk').onclick=lock;$('#td').onclick=today;$('#mo').onclick=moreMenu;$('#dt').onclick=()=>delT(S.name);$('#nf').onclick=async()=>{const t=await ask('New folder name');if(t&&t.trim()){const v=t.trim();if(!allF().includes(v)){(S.data.fd=S.data.fd||[]).push(v);save()}side()}};$('#sq').oninput=e=>{q=e.target.value;side()};$('#nw').onclick=()=>{const n=mk('Untitled '+(S.data.notes.length+1),cur?cur.folder:'');S.data.notes.push(n);cur=n;view='w';read=false;save();side();main()};side();main()}
function tgSide(){const a=$('#app');if(a)a.classList.toggle('hide')}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='b'&&S){e.preventDefault();tgSide()}});
function allF(){return[...new Set([...(S.data.fd||[]),...live().map(n=>n.folder).filter(Boolean)])]}
const COL={};let tg='';
const tagsOf=n=>[...new Set((txt(n).match(/(?:^|\s)#[\p{L}\p{N}_-]+/gu)||[]).map(x=>x.trim().slice(1).toLowerCase()))];
function stat(){const e=$('#st');if(!e||!cur)return;const t=txt(cur),w=(t.match(/\S+/g)||[]).length;e.textContent=w+' words · '+t.length+' characters · ~'+Math.max(1,Math.round(w/200))+' min read · updated '+new Date(cur.upd||Date.now()).toLocaleString()}
function side(){const T=$('#tree');if(!T)return;T.textContent='';
 try{const ql=(q||'').toLowerCase(),L=live(),f={},tc={};
  L.forEach(n=>tagsOf(n).forEach(t=>tc[t]=(tc[t]||0)+1));if(tg&&!tc[tg])tg='';
  const TG=$('#tags');TG.innerHTML='';Object.keys(tc).sort().forEach(t=>{const b=document.createElement('button');b.className='tg'+(t==tg?' on':'');b.textContent='#'+t+' '+tc[t];b.onclick=()=>{tg=tg==t?'':t;side()};TG.append(b)});
  const ok=n=>(!ql||((n.title||'')+' '+txt(n)).toLowerCase().includes(ql))&&(!tg||tagsOf(n).includes(tg));
  const hd=t=>{const h=document.createElement('div');h.className='fd';h.textContent=t;T.append(h)};
  const item=n=>{const e=document.createElement('div');e.className='nt'+(n===cur?' on':'');e.textContent=(n.pin?'⭐ ':'')+(n.title||'(untitled)');e.onclick=()=>{cur=n;if(view=='g')view='w';side();main()};return e};
  const pins=L.filter(n=>n.pin&&ok(n));if(pins.length){hd('⭐ Pinned');pins.forEach(n=>T.append(item(n)))}
  if(!ql&&!tg)allF().forEach(k=>f[k]=[]);
  L.filter(ok).forEach(n=>{const k=n.folder||'Unsorted';(f[k]=f[k]||[]).push(n)});
  Object.keys(f).sort().forEach(k=>{const c=COL[k],h=document.createElement('div');h.className='fd';
   const lb=document.createElement('span');lb.className='fl';lb.textContent=(c?'▸ ':'▾ ')+'📁 '+k;lb.onclick=()=>{COL[k]=!COL[k];side()};h.append(lb);
   const ct=document.createElement('span');ct.textContent=f[k].length;h.append(ct);
   if(k!='Unsorted'&&!ql&&!tg){const ac=document.createElement('span');ac.className='fa';[['✎','Rename folder',()=>renF(k)],['✕','Delete folder',()=>delF(k)]].forEach(x=>{const b=document.createElement('button');b.textContent=x[0];b.title=x[1];b.onclick=x[2];ac.append(b)});h.append(ac)}
   T.append(h);if(!c)f[k].forEach(n=>T.append(item(n)))});
  const tr=S.data.notes.filter(n=>n.del);
  if(tr.length&&!ql&&!tg){const h=document.createElement('div');h.className='fd';const lb=document.createElement('span');lb.className='fl';const open0=COL.__t===false;lb.textContent=(open0?'▾ ':'▸ ')+'🗑 Trash';lb.onclick=()=>{COL.__t=open0?true:false;side()};h.append(lb);const ct=document.createElement('span');ct.textContent=tr.length;h.append(ct);T.append(h);
   if(open0)tr.forEach(n=>{const e=document.createElement('div');e.className='nt tz';const t=document.createElement('span');t.textContent=n.title||'(untitled)';e.append(t);
    [['↩','Restore',()=>{n.del=0;save();side()}],['✕','Delete forever',async()=>{if(await yes('Delete “'+(n.title||'untitled')+'” forever?')){S.data.notes=S.data.notes.filter(x=>x!==n);save();side()}}]].forEach(x=>{const b=document.createElement('button');b.textContent=x[0];b.title=x[1];b.onclick=ev=>{ev.stopPropagation();x[2]()};e.append(b)});T.append(e)})}}
